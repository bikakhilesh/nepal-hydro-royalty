name: Refresh from RMS

# Re-scrapes rmsdoed.gov.np, rebuilds every artefact and commits the result.
#
# Monthly, not nightly, and on purpose: one full pass is ~3,700 GETs against a
# government server that publishes a month in arrears, so a faster cadence would
# be pure load with nothing new to show for it.

on:
  schedule:
    - cron: '17 3 5 * *'      # 5th of each month, 03:17 UTC
  workflow_dispatch:
    inputs:
      register:
        description: 'Also re-fetch the plant register (198 GETs)'
        type: boolean
        default: true
      geo:
        description: 'Also re-resolve coordinates (OSM + Wikidata + Nominatim)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-rms
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape energy + royalty detail
        run: python hydro.py scrape

      - name: Scrape plant register
        if: github.event_name == 'schedule' || inputs.register
        run: python hydro.py meta

      - name: Re-resolve coordinates
        if: inputs.geo
        run: python hydro.py geo

      # A scrape that half-fails still writes CSVs. Committing that would quietly
      # destroy the history, so refuse to go on if the dataset shrank materially.
      - name: Guard against a truncated scrape
        run: python .github/scripts/guard.py

      - name: Rebuild dashboard and maps
        run: |
          python hydro.py build
          python hydro.py mapsvg
          python hydro.py map3d

      - name: Summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python hydro.py --stats >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if anything changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed: RMS has not filed anything new.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "data: refresh from RMS $(date -u +%Y-%m-%d)"
          git push
