name: Deploy dashboard

# Publishes the built dashboard to GitHub Pages. Worth noting that the terrain
# map only works here: it needs external tile hosts, which the Artifact CSP
# blocks outright, so Pages is the one place all three views render.

on:
  push:
    branches: [main]
    paths:
      - nepal_hydro.html
      - nepal_fleet_3d.html
      - nepal_fleet_map.svg
      - .github/workflows/pages.yml

  # A push made with GITHUB_TOKEN does not trigger other workflows -- GitHub
  # blocks that to stop workflows looping. So the monthly refresh commits new
  # data and the `push` trigger above stays silent. Hang off the run instead.
  workflow_run:
    workflows: [Refresh from RMS]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Pin to the branch tip. On a workflow_run event the default checkout is
      # github.sha, which is the head commit as of when the refresh *started* --
      # one commit behind the data that refresh then pushed. Deploy would go
      # green and republish the previous build, which is worse than failing.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Assemble the site
        run: |
          mkdir -p site
          cp nepal_hydro.html    site/index.html
          cp nepal_fleet_3d.html site/terrain.html
          cp nepal_fleet_map.svg site/fleet-map.svg
          cp dashboard.json      site/dashboard.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
