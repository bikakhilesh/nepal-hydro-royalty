name: Sync external series

# Copies two CSVs out of the private stock-scalper repo, pulls the public NEPSE
# dividend history, and commits all three here.
#
# The point of committing rather than fetching at build time: the dashboard build
# then reads an ordinary local file and needs no credential of its own, so the
# daily refresh keeps working whatever happens to the token. It also means the
# series is versioned alongside the RMS data it will be joined to, and a bad sync
# is a diff you can read rather than a number that silently moved.
#
# Runs before the RMS refresh, not after, so the day's rebuild sees the day's
# series rather than yesterday's.
#
# The dividend file is public and needs no credential, so it is fetched and
# committed whether or not SCALPER_TOKEN is set. A fork with no secret still gets
# a working dividend column.

on:
  schedule:
    - cron: '05 2 * * *'      # daily 02:05 UTC, ~70 min ahead of the RMS refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalper-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # The secret as a boolean, never as a value: `secrets` is not available to a
      # step `if` but `env` is, and this keeps the credential out of the job
      # environment entirely.
      HAS_SCALPER: ${{ secrets.SCALPER_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v5

      # GITHUB_TOKEN is scoped to this repo and cannot read another one, so this
      # needs a fine-grained PAT with Contents: read on bikakhilesh/stock-scalper.
      #
      # Skipped when the secret was never set, but allowed to fail loudly when it
      # is set and does not work. This workflow does one thing; if it cannot reach
      # the source there is nothing to be quietly resilient about, and the RMS
      # refresh is a separate workflow that a red run here does not touch.
      #
      # It was briefly continue-on-error, which was wrong twice over: it made an
      # unreachable source look like a clean run, and `conclusion` is reported as
      # success for a continue-on-error step, so the failure was invisible from
      # outside as well as in.
      - name: Fetch the private series
        if: env.HAS_SCALPER == 'true'
        uses: actions/checkout@v5
        with:
          repository: bikakhilesh/stock-scalper
          token: ${{ secrets.SCALPER_TOKEN }}
          path: _scalper
          # Only these two paths, never the whole repo.
          sparse-checkout: |
            combined/hydro_power_combined.csv
            comparative/comparative_hydro_power.csv
          sparse-checkout-cone-mode: false

      # Public repo, plain HTTPS, no token. --fail so a 404 or a 500 is an error
      # rather than an HTML error page written over the committed CSV.
      - name: Fetch the public dividend history
        run: |
          set -euo pipefail
          mkdir -p _pub
          curl -sS --fail --retry 3 --retry-delay 5 -o _pub/dividend_history.csv \
            https://raw.githubusercontent.com/bikakhilesh/dividend-history/master/dividend_history.csv
          head -1 _pub/dividend_history.csv | grep -q '^Symbol,Company,' \
            || { echo 'dividend CSV header is not what the build expects'; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Commit what changed
        run: |
          set -euo pipefail

          # where it landed -> the name it takes here. Source-prefixed, as rms_* is,
          # so provenance is legible from the filename alone.
          sync_file () {
            src="$1"; dst="$2"

            # One check for three failures: token unset, token expired, path renamed
            # upstream. In none of them is going red the right answer -- the repo
            # still holds the last good copy.
            if [ ! -f "$src" ]; then
              echo "- \`$dst\`: nothing arrived at \`$src\`" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            # Same principle as guard.py: a sync that arrives short has lost
            # something, and overwriting good data with it is worse than doing
            # nothing. Checked before the copy, so a refusal leaves the file intact.
            new=$(wc -l < "$src")
            if [ -f "$dst" ]; then
              old=$(wc -l < "$dst")
              if [ "$new" -lt "$old" ]; then
                echo "- FAIL \`$dst\`: $new rows against $old committed, the series shrank" >> "$GITHUB_STEP_SUMMARY"
                return 1
              fi
            fi

            cp "$src" "$dst"
            git add "$dst"
            echo "- \`$dst\`: $new rows" >> "$GITHUB_STEP_SUMMARY"
          }

          # Same thing for the scalper repo, which is the only source that can be
          # missing wholesale rather than one file at a time -- so it also counts
          # what arrived, for the diagnostic below.
          sync_one () {
            if [ -f "_scalper/$1" ]; then got=$((got + 1)); fi
            sync_file "_scalper/$1" "$2"
          }

          # Each is attempted whatever the other does, so one bad file cannot hide
          # the state of the other in the summary.
          bad=0; got=0
          sync_one  combined/hydro_power_combined.csv       scalper_hydro_combined.csv    || bad=1
          sync_one  comparative/comparative_hydro_power.csv scalper_hydro_comparative.csv || bad=1
          sync_file _pub/dividend_history.csv               nepse_dividends.csv           || bad=1
          if [ "$bad" != 0 ]; then
            echo "Not committing: see the failure above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Nothing arrived from the private repo, which is not the same as nothing
          # having changed and must not be reported in the same words -- a run that
          # compared nothing should never read as a clean bill of health. Diagnosed,
          # but no longer an early exit: the dividend fetch is a separate public
          # source and may well have something to commit even when this one is
          # unreachable.
          if [ "$got" = 0 ] && [ "${HAS_SCALPER:-}" = 'true' ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Neither scalper path matched. The checkout itself worked, so this is the' >> "$GITHUB_STEP_SUMMARY"
            echo 'paths, not the token. What the scalper repo actually holds:' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # ls-tree reads the tree object, so it lists the whole repo even though
            # the working copy is a two-file sparse checkout.
            git -C _scalper ls-tree -r --name-only HEAD | head -60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'The committed scalper copies are untouched.' >> "$GITHUB_STEP_SUMMARY"
          fi

          # The map is derived from the series, the register and the overrides, so it
          # is rebuilt here rather than committed by hand and left to rot. Its output
          # goes to the summary because a newly listed ticker it cannot place is the
          # one thing in this job that needs a person, and it must not pass silently.
          if [ "$got" != 0 ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python hydro.py companies 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git add scalper_company_map.csv
          fi

          # Staged, then compared. `git diff` alone reports no change for a file that
          # is not tracked yet, so on the first run it would find nothing to do and
          # never commit anything.
          if git diff --cached --quiet; then
            echo 'Unchanged: every source matches the committed copy.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: sync external series $(date -u +%Y-%m-%d)"
          git push
