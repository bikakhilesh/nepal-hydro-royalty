name: Claude review

# Reviews every pull request as it opens and on each push to it.
#
# Dormant for now: this repository has never had a pull request, everything has
# gone straight onto main. It starts working the moment that changes -- including
# on the branches Claude itself opens from an issue.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This is a data pipeline that renders a
            single static page, not an application, so weigh it accordingly.

            What matters here:

            - nepal_hydro.html, nepal_fleet_map.svg and nepal_fleet_3d.html are
              generated. A diff that touches them without a matching change in
              hydro.py or template.html is a hand-edit and will be overwritten
              by the next scheduled refresh. Say so plainly.
            - The register's fiscal year runs Asar to Jestha; the Nepali
              accounting year runs Shrawan to Asar, one month later. Any new
              join between register data and company filings has to re-cut on
              the accounting year, and getting this wrong is silent -- the
              numbers still come out, they are just wrong.
            - A plant load factor is never inferred. Blank in
              scalper_plf_input.csv means unavailable, and a filled-in guess is
              worse than a gap.
            - The sync workflows carry shrink guards for a reason. Check that a
              change to them cannot let a truncated upstream file through.
            - Figures on the page should say what cohort they were struck on.
              A median that silently mixes bases is a defect here.

            Skip the generic checklist. Only raise something you can point at,
            with the failure it would cause. If the diff is fine, say it is fine
            and stop.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
