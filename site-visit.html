<script type="module">
/* ============================== formulas ============================== */
const DEFAULTS = {
  site:{ grossHead:120, headLossFrac:0.06, designQ:10.3, eff:0.88, availability:0.95,
         dryAvgQ:5.2, wetOutFrac:0.81 },
  season:{ option:1, dryHours:4368, wetHours:4392, dryDays:182,
           minDryShare:{1:0.30, 2:0.15} },
  tariff:{ ror:{dry:8.40, wet:4.80},
           pror:{peakByHours:{"1":8.50,"2":8.80,"3":9.40,"4to6":10.55}, wet:4.80, offPeakDry:8.40},
           reservoir:{legacy:{dry:12.40,wet:7.10}, erc2082:{dry:14.80,wet:8.45}} },
  escalation:{ rateSimple:0.03, count:8 },
  pror:{ peakHours:6, premiumAllDry:true, incrementalPondCr:20 },
  royalty:{ first15:{ "1to10":[100,0.0175], "10to100":[150,0.0185], "above100":[200,0.02] },
            after15:{ "1to10":[1000,0.10], "10to100":[1200,0.10], "above100":[1500,0.10] } },
  reservoir:{ installedMw:100, annualGwh:380, dryShareFrac:0.50 }
};

const clamp = (v,a,b)=> Math.min(Math.max(v,a),b);
const lerp = (a,b,t)=> a+(b-a)*t;
const netHead = (H,loss)=> H*(1-loss);
const powerKw = (Q,H,eff)=> 9.81*Q*H*eff;
const installedMwFromQ = (Q,H,eff)=> Math.round(powerKw(Q,H,eff)/100)/10;
function siteEnergy(inp){
  const Hn = netHead(inp.grossHead, inp.headLossFrac);
  const instMw = installedMwFromQ(inp.designQ, Hn, inp.eff);
  // Water in excess of the turbines' own design flow is spilled, not generated --
  // capped here, or a design smaller than the average dry flow (a real choice, not
  // just a hypothetical: see the flow-duration picker at the basin) would compute
  // more dry-season power than the plant can physically pass.
  const dryKw = Math.min(powerKw(inp.dryAvgQ, Hn, inp.eff), instMw*1000);
  const dryE = dryKw * DEFAULTS.season.dryHours * inp.availability;
  const wetE = instMw*1000 * inp.wetOutFrac * DEFAULTS.season.wetHours * inp.availability;
  const annual = dryE + wetE;
  const plf = annual / (instMw*1000*8760);
  const dryShare = annual>0 ? dryE/annual : 0;
  return { netHead:Hn, installedMw:instMw, dryKw, dryEnergyKwh:dryE, wetEnergyKwh:wetE,
           annualEnergyKwh:annual, plf, dryShare };
}
const tariffInYear = (base, year)=> base*(1 + DEFAULTS.escalation.rateSimple *
  Math.min(Math.max(year-1,0), DEFAULTS.escalation.count));
const revenueRor = (dryE,wetE,tar,year)=>
  dryE*tariffInYear(tar.dry,year) + wetE*tariffInYear(tar.wet,year);
function revenuePror(dryE, wetE, instMw, tar, year, blockOnly){
  const peakRate = tariffInYear(tar.dry,year), wetRate = tariffInYear(tar.wet,year),
        offRate = tariffInYear(DEFAULTS.tariff.pror.offPeakDry,year);
  if(!blockOnly) return dryE*peakRate + wetE*wetRate;
  const peakKwh = instMw*1000*DEFAULTS.pror.peakHours*DEFAULTS.season.dryDays*DEFAULTS.site.availability;
  const pk = Math.min(peakKwh, dryE);
  return pk*peakRate + (dryE-pk)*offRate + wetE*wetRate;
}
function royaltyFor(instMw, revenue, after15){
  const tier = instMw<=10 ? "1to10" : (instMw<=100 ? "10to100" : "above100");
  const table = after15 ? DEFAULTS.royalty.after15 : DEFAULTS.royalty.first15;
  const [capRate, pct] = table[tier];
  return instMw*1000*capRate + pct*revenue;
}
function shortfallComp(dryShare, minShare, dryE, annualE, wetRate){
  if(dryShare >= minShare) return 0;
  return Math.max(0, annualE - dryE/minShare) * wetRate;
}
// Generic Himalayan-shaped flow-duration curve: multiple of mean annual flow at each
// exceedance percentile. Illustrative only -- every real river has its own curve, built
// from years of gauged stage readings converted through a rating curve (stage -> Q).
const FDC_PTS = [[5,3.3],[10,2.6],[20,2.0],[30,1.6],[40,1.3],[50,1.05],
                 [65,0.75],[80,0.5],[90,0.35],[95,0.25],[99,0.15]];
const FDC_QMEAN = 8.0;   // m3/s -- picked so Q40 lands close to this page's own designQ
function fdcQ(pct){
  const pts = FDC_PTS;
  if(pct<=pts[0][0]) return pts[0][1]*FDC_QMEAN;
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i], [x1,y1]=pts[i+1];
    if(pct>=x0 && pct<=x1) return lerp(y0,y1,(pct-x0)/(x1-x0))*FDC_QMEAN;
  }
  return pts[pts.length-1][1]*FDC_QMEAN;
}
const gwh = kwh => kwh/1e6;
const cr  = npr => npr/1e7;

(function selfCheck(){
  const e = siteEnergy(DEFAULTS.site);
  const rev1 = revenueRor(e.dryEnergyKwh, e.wetEnergyKwh, DEFAULTS.tariff.ror, 1);
  console.log("[hydro] netHead", e.netHead.toFixed(1), "installedMw", e.installedMw,
    "dryGWh", gwh(e.dryEnergyKwh).toFixed(2), "wetGWh", gwh(e.wetEnergyKwh).toFixed(2),
    "PLF%", (e.plf*100).toFixed(1), "dryShare%", (e.dryShare*100).toFixed(1),
    "rev1 Cr", cr(rev1).toFixed(2), "blended", (rev1/e.annualEnergyKwh).toFixed(2));
})();

/* ============================== app state ============================== */
const APP = {
  plantType:"RoR", season:5, tod:12, tourIndex:-1, tourPlaying:false, panelTab:"look",
  calc:{...DEFAULTS.site},
  ppa:{ seasonOption:1, prorPeakHours:"4to6", prorBlockOnly:false,
        reservoirRegime:"erc2082", escYear:1, reservoirDryGwh:190, reservoirWetGwh:190 },
};
const BS_MONTHS = ["Baisakh","Jestha","Asar","Shrawan","Bhadra","Asoj",
  "Kartik","Mangsir","Poush","Magh","Falgun","Chaitra"];
const BS_GREG = ["mid-Apr\u2013mid-May","mid-May\u2013mid-Jun","mid-Jun\u2013mid-Jul","mid-Jul\u2013mid-Aug",
  "mid-Aug\u2013mid-Sep","mid-Sep\u2013mid-Oct","mid-Oct\u2013mid-Nov","mid-Nov\u2013mid-Dec",
  "mid-Dec\u2013mid-Jan","mid-Jan\u2013mid-Feb","mid-Feb\u2013mid-Mar","mid-Mar\u2013mid-Apr"];
function seasonWetness(i){
  const dist = Math.min(Math.abs(i-3.5), 12-Math.abs(i-3.5));
  return clamp(1 - dist/6, 0, 1);
}

let viewTween=null;
function setView(v, animate=true){
  const from={...VB}, to={x:v[0],y:v[1],w:v[2],h:v[3]};
  if(prefersReducedMotion || !animate){ Object.assign(VB,to); applyVB(); return; }
  viewTween={from,to,start:performance.now(),dur:900};
}
function applyVB(){
  svg.setAttribute("viewBox", `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
  // Labels are drawn in scene units, so zooming in magnifies them along with the
  // drawing and they end up filling the frame. Counter-scale each one about its own
  // anchor so type stays the same size on screen at every zoom level.
  const k = VB.w/1600;
  // Zoomed out there is no room for twelve labels, so the secondary ones drop away and
  // only the seven tour stops stay. They come back as soon as the view is tight enough.
  const showAll = k < 0.62;
  for(const [id,g] of Object.entries(labelEls)){
    const a = anchorFor(id);
    if(!a) continue;
    g.setAttribute("transform", `translate(${a.x*(1-k)} ${a.y*(1-k)}) scale(${k})`);
    const vis = showAll || TOUR.some(t=>t.id===id);
    g.style.display = vis ? "" : "none";
    if(leaderEls[id]) leaderEls[id].style.display = vis ? "" : "none";
  }
  pondNote.setAttribute("transform", `translate(${PN_X*(1-k)} ${PN_Y*(1-k)}) scale(${k})`);
  const HL_X=HEAD_X+18, HL_Y=(HR_Y1+PH_Y+PH_H-10)/2;
  headLabel.setAttribute("transform", `translate(${HL_X*(1-k)} ${HL_Y*(1-k)}) scale(${k})`);
  headSub.setAttribute("transform", `translate(${HL_X*(1-k)} ${(HL_Y+20)*(1-k)}) scale(${k})`);
  const RS_X=RES_HEAD_X+18, RS_Y=FSL+90;
  resHeadSub.setAttribute("transform", `translate(${RS_X*(1-k)} ${RS_Y*(1-k)}) scale(${k})`);
  updateResHeadTransform();
}
function stepView(now){
  if(!viewTween) return;
  const t=clamp((now-viewTween.start)/viewTween.dur,0,1);
  const e = t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  VB.x=lerp(viewTween.from.x,viewTween.to.x,e); VB.y=lerp(viewTween.from.y,viewTween.to.y,e);
  VB.w=lerp(viewTween.from.w,viewTween.to.w,e); VB.h=lerp(viewTween.from.h,viewTween.to.h,e);
  applyVB();
  if(t>=1) viewTween=null;
}
// A 2:1 profile in a column that is rarely 2:1 will letterbox, and cropping is not an
// option -- the whole point is seeing catchment and metering point at once. So the
// letterbox is dressed instead: #scene carries a sky-to-ground gradient behind the
// drawing, and the bands read as more sky above and more ground below.

function setFocus(id){
  svg.classList.toggle("touring", !!id);
  for(const [k,g] of Object.entries(labelEls)) g.classList.toggle("focused", k===id);
  const map={basin:["g-back","g-river","g-gauge","g-fdc"], gauging_station:["g-gauge","g-river","g-fdc"],
    headworks:["g-weir","g-pond","g-res","g-river"], desander:["g-desander"],
    headrace:["g-headrace","g-river","g-head"], forebay_surge:["g-forebay","g-pond","g-penstock","g-ph"],
    penstock:["g-penstock","g-head","g-res"], powerhouse:["g-ph","g-ph-res","g-head"],
    tailrace:["g-tail","g-river"], switchyard:["g-yard"], transmission:["g-tx"],
    metering_point:["g-meter","g-tx"]};
  const keep = new Set(map[id]||[]);
  document.querySelectorAll("#scene .dimmable").forEach(g=>
    g.classList.toggle("focused", !id || keep.has(g.id)));
}
function goToStop(idx, animate=true){
  APP.tourIndex=idx;
  const stop=TOUR[idx];
  const v = (APP.plantType==="Reservoir" && TOUR_VIEW_RES[stop.n]) || stop.view;
  setView(v, animate);
  setFocus(stop.id);
  document.querySelectorAll(".tour-dot").forEach((d,i)=>d.setAttribute("aria-current",String(i===idx)));
  const title = (APP.plantType==="Reservoir" && TOUR_TITLE_RES[stop.n]) || stop.title;
  document.getElementById("tour-title").textContent = stop.n+". "+title;
  if(stop.day) startDayClock(); else stopDayClock();
  APP.panelTab="look"; setActiveTab("look"); renderPanel(stop.id);
}
function focusStructure(id){
  const idx=TOUR.findIndex(s=>s.id===id);
  if(idx>=0){ stopPlay(); goToStop(idx); return; }
  stopPlay(); stopDayClock();
  const a=anchorFor(id);
  setView([a.x-260, a.y-140, 560, 320]);
  setFocus(id);
  APP.panelTab="look"; setActiveTab("look"); renderPanel(id);
}
function showWhole(){
  stopPlay(); stopDayClock(); APP.tourIndex=-1;
  setView(WHOLE_VIEW); setFocus(null);
  document.querySelectorAll(".tour-dot").forEach(d=>d.setAttribute("aria-current","false"));
  document.getElementById("tour-title").textContent="Whole scheme";
}

  Object.assign(hotspots.desander, res?RES_DESANDER_TEXT:DESANDER_TEXT);
  Object.assign(hotspots.headrace, res?RES_HEADRACE_TEXT:HEADRACE_TEXT);
  gWeir.style.display   = res?"none":"";
  gDesander.style.display = res?"none":"";
  gHeadrace.style.display = res?"none":"";
  gFdc.style.display      = res?"none":"";
  gForebay.style.display  = ror?"":"none";
  gPond.style.display     = pror?"":"none";
  gPenstock.style.display = res?"none":"";
  gPH.style.display       = res?"none":"";
  gTail.style.display     = res?"none":"";
  gRes.style.display      = res?"":"none";
  gPHres.style.display    = res?"":"none";
  gHead.style.display     = res?"none":"";
  document.querySelectorAll("#type-switch button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.type===type)));
  document.getElementById("cap-readout").textContent =
    ror ? "\u2248 10 MW" : pror ? "\u2248 10 MW + daily pond" : "\u2248 100 MW class";
  // The daily cycle runs all year; only the premium it earns is seasonal, so the clock
  // stays available in every month rather than vanishing outside the dry season.
  document.getElementById("tod-block").classList.toggle("show", pror);
  if(!pror) stopDayClock();
  const atId = APP.tourIndex>=0 ? TOUR[APP.tourIndex].id : null;
  rebuildTour();     // PRoR gains a stop, so dots and badges are renumbered before drawing
  if(atId){
    const i = TOUR.findIndex(t=>t.id===atId);
    APP.tourIndex = i>=0 ? i : Math.min(APP.tourIndex, TOUR.length-1);
  }
  drawLabels();
  applyVB();   // labels were just rebuilt: re-apply counter-scale and the zoom-level rule
  if(APP.tourIndex>=0) goToStop(APP.tourIndex,false); else setFocus(null);
  applySeason(APP.season);
  renderPanel();
}

/* ============================== season ============================== */
function applySeason(i){
  APP.season=i;
  const wet=seasonWetness(i), dry=isDryMonth(i);
  // river swells and brightens through the monsoon
  riverPath.setAttribute("stroke-width", String(lerp(9,22,wet)));
  riverPath.setAttribute("stroke", wet>0.5?"var(--river)":"#3F7188");
  riverFlow.setAttribute("stroke-width", String(lerp(3,6,wet)));
  riverFlow.style.animationDuration = (prefersReducedMotion?0:lerp(3.2,1.0,wet))+"s";
  spill.style.display = wet>0.72 ? "" : "none";     // only overtops in high monsoon
  const accent = wet>0.4 ? "#4E88A6" : "#C8923A";
  document.documentElement.style.setProperty("--accent", accent);
  document.documentElement.style.setProperty("--accent-soft",
    wet>0.4?"rgba(78,136,166,.16)":"rgba(200,146,58,.16)");
  // reservoir fills through the monsoon and draws down toward the minimum operating
  // level over the dry months; the head dimension follows the surface down with it
  const surf = lerp(MOL, FSL, wet);
  resWater.setAttribute("d", lakePath(surf));
  deadStore.setAttribute("d", lakePath(RES_SILL));
  resHeadLine.setAttribute("y1", String(surf));
  resHeadTop.setAttribute("y1", String(surf)); resHeadTop.setAttribute("y2", String(surf));
  resHeadLabel.setAttribute("y", String((surf + RES_PH_Y+RES_PH_H-10)/2));
  updateResHeadTransform();   // label just moved: re-anchor it at its new position
  // 1 scene unit of fall is scaled so the RoR gross head of 120 m reads as its own dimension
  const M_PER_UNIT = APP.calc.grossHead / ((PH_Y+PH_H-10) - HR_Y1);
  resHeadLabel.textContent = `Gross head ${Math.round(((RES_PH_Y+RES_PH_H-10)-surf)*M_PER_UNIT)} m`;
  drawdownNote.textContent = surf>FSL+6 ? `drawn down ${Math.round((surf-FSL)*M_PER_UNIT)} m` : "";
  document.querySelectorAll("#season-dial button").forEach((b,idx)=>
    b.setAttribute("aria-pressed", String(idx===i)));
  document.getElementById("season-name").textContent = BS_MONTHS[i];
  document.getElementById("season-caption").textContent =
    (dry?"Dry season (":"Wet season (")+BS_GREG[i]+") \u2014 "+(dry?"tariff column: dry":"tariff column: wet");
  document.getElementById("tod-block").classList.toggle("show", APP.plantType==="PRoR");
  updateHeadLabel();
  applyTod(APP.tod);
  renderPanel();
}
function updateHeadLabel(){
  const e = siteEnergy(APP.calc);
  headLabel.textContent = `Gross head ${APP.calc.grossHead} m \u2192 net ${e.netHead.toFixed(1)} m`;
}

/* ============================== time of day (PRoR) ==============================
   Inflow from the headrace is constant; outflow is not. The pond takes the difference,
   filling through the day and emptying through the six-hour evening peak block. */
function applyTod(h){
  APP.tod=h;
  const pror = APP.plantType==="PRoR";
  const peak = h>=18 && h<=24;
  const fill = clamp(peak ? 1-(h-18)/6 : h/18, 0, 1);   // continuous across midnight
  const surf = lerp(POND_MOL, POND_FSL, fill);
  pondWater.setAttribute("d",
    `M${bankL(surf)} ${surf} L${bankR(surf)} ${surf} L${bankR(POND_FLOOR)} ${POND_FLOOR} `+
    `L${bankL(POND_FLOOR)} ${POND_FLOOR} Z`);
  pondSurf.setAttribute("d", `M${bankL(surf)+8} ${surf} L${bankR(surf)-8} ${surf}`);
  pondNote.textContent = (peak ? "peak block \u2014 releasing, pond " : "filling \u2014 pond ")
    + Math.round(fill*100) + "% full";
  pondNote.style.fill = peak ? "var(--ochre)" : "var(--rock)";
  // the penstock and the runner carry the release schedule: idling by day, hard at 18:00
  svg.style.setProperty("--fd", (pror ? (peak?0.65:2.9) : 1.5)+"s");
  svg.style.setProperty("--sd", (pror ? (peak?0.5:2.2) : 1.1)+"s");
  svg.style.setProperty("--sd-gen", (pror ? (peak?1.2:4.4) : 2.6)+"s");
  const slider=document.getElementById("tod-slider");
  if(+slider.value!==h) slider.value=h;
  document.getElementById("tod-now").textContent =
    String(Math.floor(h)).padStart(2,"0")+":"+(h%1?"30":"00");
  // outside the dry season there is no peak column to win, which is itself the lesson
  const dry = isDryMonth(APP.season);
  const rate = !dry ? DEFAULTS.tariff.pror.wet
             : peak ? DEFAULTS.tariff.pror.peakByHours[APP.ppa.prorPeakHours]
                    : DEFAULTS.tariff.pror.offPeakDry;
  document.getElementById("tod-tariff").textContent =
    (!dry ? "wet \u00b7 NPR " : peak ? "peak \u00b7 NPR " : "off-peak \u00b7 NPR ")+rate.toFixed(2);
  document.getElementById("tod-cycle").textContent = !dry
    ? "Wet season: the river alone fills the plant, so the pond earns nothing this month."
    : peak ? "Dry-season peak block: every kWh released now is paid at the peak rate."
           : "Storing dry-season inflow instead of selling it at the off-peak rate.";
}
/* The pond stop plays its own day rather than waiting to be scrubbed: this is the one
   difference between RoR and PRoR that is a behaviour and cannot be seen in a still. */
const DAY_MS = 16000;
let dayClock = null;
function startDayClock(){
  if(APP.plantType!=="PRoR" || prefersReducedMotion) return;
  dayClock = { t0: performance.now() - APP.tod/24*DAY_MS };
}
function stopDayClock(){ dayClock = null; }
function stepDay(now){
  if(!dayClock) return;
  applyTod(Math.round((((now-dayClock.t0)%DAY_MS)/DAY_MS*24)*2)/2);
}

/* ============================== panel ============================== */
const GLOSSARY = [
["Availability factor","Fraction of hours the plant is able to run; 1 minus planned and forced outage.","Multiplies straight into energy and revenue; 0.95 is normal, above 0.97 in a DPR is optimistic."],
["Bikram Sambat (BS)","Nepali calendar; fiscal year runs Shrawan&ndash;Asar (mid-July to mid-July), written FY 2082/83.","PPA seasons and financial statements are on BS months; the dry season straddles the fiscal year end."],
["BOOT","Build-Own-Operate-Transfer: the plant is handed to GoN free of cost when the licence expires.","No terminal value in the DCF beyond licence expiry."],
["Blended tariff","Annual revenue divided by annual energy (NPR/kWh).","One number that captures dry share and type premium; compare across companies."],
["COD / RCOD","Commercial Operation Date; Required COD is the PPA deadline.","Delay triggers liquidated damages and can forfeit the tax holiday and escalations."],
["Contract energy","Monthly energy NEA commits to buy at the PPA rate.","Energy above it is paid at the excess-energy price; model excess conservatively."],
["Deemed generation","Payment for energy the plant could have produced but NEA could not evacuate.","Absent in many small-IPP PPAs; transmission delay then hits revenue directly."],
["Design discharge","Flow (m&sup3;/s) the plant is built to pass at full output, usually Q40.","Sets installed MW; a Q40 plant spills in monsoon and runs part-load in winter."],
["Dry energy / wet energy","Energy delivered in the PPA-defined dry and wet seasons.","Dry tariff is 1.75x wet for RoR; dry share drives revenue and DSCR."],
["DSCR","Cash available for debt service / debt service, tested annually or semi-annually.","For RoR the binding test is the dry-season half; check the sculpting."],
["Environmental flow","Minimum flow that must bypass the intake (typically 10% of minimum monthly flow).","Reduces usable dry-season discharge; priced at RoR rates for reservoirs."],
["ERC","Electricity Regulatory Commission; approves tariffs and PPA terms since 2019.","Rate changes now come from ERC directives, not only NEA board decisions."],
["Escalation","3% simple increase on the base tariff for 8 years, then flat.","Nominal revenue is flat after year 9 while opex inflates; margins compress late."],
["Excess energy","Metered energy above contract energy in a month.","Paid at PPA-specific terms; do not assume the posted rate."],
["Flow-duration curve","Plot of discharge vs % of time equalled or exceeded; Q40 is the flow exceeded 40% of the time.","The chart behind every energy estimate; ask which years it uses."],
["Gross head / net head","Vertical drop forebay-to-tailrace; net head subtracts friction losses.","Head is fixed by construction; the only variable is water."],
["Installed capacity","Rated output in MW at design discharge and net head.","Determines capacity royalty regardless of generation."],
["Live storage / dead storage","Reservoir volume usable for generation vs volume below the intake.","Sedimentation eats live storage over the licence life."],
["PLF","Plant load factor: annual energy / (installed MW &times; 8,760 h).","Sanity check for DPR energy claims; compare only within the same plant type."],
["Pondage","Small storage (hours) allowing daily peaking without seasonal storage.","Cheapest route to the PRoR dry-season premium."],
["PPA","Power Purchase Agreement between the developer and NEA.","Read the season definition, escalation anchor and take-or-pay basis before modelling."],
["PRoR","Peaking Run-of-River: RoR with a daily pond concentrating generation into peak hours.","Dry tariff up to 10.55 vs 8.40."],
["Q40 / Q45","Design flow exceeded 40% / 45% of the time.","Q45 designs have a higher PLF but lower installed MW; Q40 is the NEA norm."],
["Reservoir (storage) project","Dam creating seasonal storage; must deliver &ge;35% dry energy to be priced as storage.","Highest tariff and least seasonal cash flow, but longest and riskiest construction."],
["RoR","Run-of-River: no storage; generation follows the river.","Most NEPSE hydro IPPs; the model is a hydrology model with a tariff overlay."],
["Royalty","Capacity royalty (NPR/kW/yr) plus energy royalty (% of revenue), stepping up after year 15.","A 2% deduction in early years becomes ~10%+ later; model the step."],
["Take-or-pay / take-and-pay","Whether NEA pays for contracted energy it does not off-take.","Take-and-pay shifts curtailment risk to the developer."],
["Tax holiday","100% income-tax exemption for 10 years, 50% for 5 more, for projects reaching COD by the cut-off.","Effective tax rate is a step function; check the COD date against the current cut-off."],
];

function renderPanel(focusId){
  const body=document.getElementById("panel-body");
  if(APP.panelTab==="look") body.innerHTML=renderLook(focusId);
  else if(APP.panelTab==="calc") body.innerHTML=renderCalc();
  else if(APP.panelTab==="ppa") body.innerHTML=renderPPA();
  else body.innerHTML=renderGlossary();
  wireDynamicInputs();
}
function renderLook(focusId){
  const id = focusId || (APP.tourIndex>=0 ? TOUR[APP.tourIndex].id : null);
  const h = id && hotspots[id];
  if(!h) return `<h2>Welcome to the site</h2><p>This is a longitudinal profile of a generic Nepali scheme: upstream and high on the left, the NEA metering point downstream on the right. Click any label, or start the guided tour below.</p>
    <p class="why">The dashed dimension in the middle is the gross head &mdash; the vertical distance the water falls between the forebay and the tailrace. Everything upstream of the meter is cost; the meter is revenue.</p>
    <p class="why">Press 1 / 2 / 3 to switch plant type, &larr; / &rarr; to move through the Bikram Sambat year, 0 to zoom back out.</p>`;
  return `<h2>${h.name}</h2><p>${h.text}</p>`;
}
function fieldNum(key,label,step,obj){
  return `<div class="field"><label for="in-${key}">${label}</label>
    <input type="number" id="in-${key}" data-k="${key}" step="${step}" value="${obj[key]}"></div>`;
}
function renderCalc(){
  const c=APP.calc, e=siteEnergy(c);
  return `
  <h2>Energy &amp; PLF calculator</h2>
  <fieldset><legend>Site inputs</legend>
    ${fieldNum("grossHead","Gross head (m)",1,c)}

    ${fieldNum("designQ","Design discharge (m&sup3;/s)",0.1,c)}
    ${fieldNum("eff","Overall efficiency",0.01,c)}
    ${fieldNum("availability","Availability factor",0.01,c)}

  </fieldset>
  <div class="arith">H_net = ${c.grossHead} &times; (1 &minus; ${c.headLossFrac}) = ${e.netHead.toFixed(1)} m<br>
  P = 9.81 &times; ${c.designQ} &times; ${e.netHead.toFixed(1)} &times; ${c.eff} = ${powerKw(c.designQ,e.netHead,c.eff).toFixed(0)} kW</div>
  <div class="out-line"><span class="k">Net head</span><span class="v">${e.netHead.toFixed(1)} m</span></div>

  ${dryComplianceFlag(e)}

}
/* Figures from the register this page is built alongside, so the worked model above can
   be read against the fleet it exists to explain rather than in a vacuum. Injected at
   build time by hydro.py; absent when the template is opened directly, which is why the
   parse is guarded rather than assumed. */
function fleetScale(){
  if(!FLEET) return "";
  return `<h3>For scale, from the register</h3>
  <div class="out-line"><span class="k">Median contracted PLF</span><span class="v">${FLEET.cplfMed}% <span class="why">${FLEET.cplfN} plants</span></span></div>
  <div class="out-line"><span class="k">Median achieved capacity factor</span><span class="v">${FLEET.cfMed}% <span class="why">${FLEET.cfN} plants</span></span></div>
  <div class="out-line"><span class="k">Fleet dry-season share of generation</span><span class="v">${FLEET.dryShare}%</span></div>
  <p class="why">${FLEET.n} plants, FY ${FLEET.fy}, retrieved ${FLEET.retrieved}. Contracted PLF is
  what the PPA promises; capacity factor is what the meters actually recorded. The distance between
  those two medians is most of what the ledger is about &mdash; and the dry share above is the fleet
  answering the same question this page asks at the catchment.</p>`;
}
function dryComplianceFlag(e){
  const min=DEFAULTS.season.minDryShare[APP.ppa.seasonOption];
  if(e.dryShare>=min) return `<div class="flag ok">Passes the Option ${APP.ppa.seasonOption} minimum dry-energy share (&ge;${(min*100).toFixed(0)}%).</div>`;
  const comp=shortfallComp(e.dryShare,min,e.dryEnergyKwh,e.annualEnergyKwh,DEFAULTS.tariff.ror.wet);
  return `<div class="flag warn">Below the Option ${APP.ppa.seasonOption} minimum dry share (${(min*100).toFixed(0)}%). Shortfall compensation &asymp; NPR ${cr(comp).toFixed(2)} crore, computed as (annual &minus; dry&divide;min) &times; wet rate.</div>`;
}
function renderPPA(){
  const e=siteEnergy(APP.calc), p=APP.ppa;
  const rorRev1=revenueRor(e.dryEnergyKwh,e.wetEnergyKwh,DEFAULTS.tariff.ror,1);
  const rorRevY=revenueRor(e.dryEnergyKwh,e.wetEnergyKwh,DEFAULTS.tariff.ror,p.escYear);
  const prorTar={dry:DEFAULTS.tariff.pror.peakByHours[p.prorPeakHours],wet:DEFAULTS.tariff.pror.wet};
  const prorRev1=revenuePror(e.dryEnergyKwh,e.wetEnergyKwh,e.installedMw,prorTar,1,p.prorBlockOnly);
  const royalty1=royaltyFor(e.installedMw,rorRev1,false);
  const royalty16=royaltyFor(e.installedMw,rorRev1,true);
  const resTar=DEFAULTS.tariff.reservoir[p.reservoirRegime];
  const resRev=p.reservoirDryGwh*1e6*resTar.dry + p.reservoirWetGwh*1e6*resTar.wet;
  const resAnnual=(p.reservoirDryGwh+p.reservoirWetGwh)*1e6;
  const resBlend=resRev/resAnnual;
  const bars=[{label:"RoR",val:rorRev1/e.annualEnergyKwh,color:"#4E88A6"},
              {label:"PRoR",val:prorRev1/e.annualEnergyKwh,color:"#C8923A"},

    const bw=54,gap=18,x0=30+i*(bw+gap),h=Math.round(b.val/maxV*90);
    return `<rect x="${x0}" y="${110-h}" width="${bw}" height="${h}" fill="${b.color}"/>
      <text x="${x0+bw/2}" y="122" font-size="9" text-anchor="middle">${b.label}</text>

  return `

  <fieldset><legend>PPA season option</legend>
    <div class="radio-row"><label><input type="radio" name="seasonOpt" value="1" ${p.seasonOption===1?"checked":""}> Option 1 (6 wet/6 dry)</label></div>

  </fieldset>

    <div class="out-line"><span class="k season-dry">Dry revenue</span><span class="v">NPR ${cr(e.dryEnergyKwh*DEFAULTS.tariff.ror.dry).toFixed(2)} cr</span></div>
    <div class="out-line"><span class="k season-wet">Wet revenue</span><span class="v">NPR ${cr(e.wetEnergyKwh*DEFAULTS.tariff.ror.wet).toFixed(2)} cr</span></div>
    <div class="out-line"><span class="k">Year-1 total</span><span class="v">NPR ${cr(rorRev1).toFixed(2)} cr</span></div>
    <div class="out-line"><span class="k">Blended tariff</span><span class="v">NPR ${(rorRev1/e.annualEnergyKwh).toFixed(2)}/kWh</span></div>
  </div>
  <fieldset><legend>Escalation / project year</legend>
    <div class="field"><label for="in-escYear">Project year (1&ndash;${DEFAULTS.escalation.count+1}+)</label>
    <input type="number" id="in-escYear" data-k="escYear" min="1" max="30" step="1" value="${p.escYear}"></div>
  </fieldset>
  <div class="out-line"><span class="k">RoR revenue, year ${p.escYear}</span><span class="v">NPR ${cr(rorRevY).toFixed(2)} cr</span></div>
  <fieldset><legend>PRoR peaking</legend>
    <div class="field wide"><label for="in-peakHours">Guaranteed peaking hours</label>
      <select id="in-peakHours" data-k="prorPeakHours">
        <option value="1" ${p.prorPeakHours==="1"?"selected":""}>1&ndash;&lt;2 h (8.50)</option>
        <option value="2" ${p.prorPeakHours==="2"?"selected":""}>2&ndash;&lt;3 h (8.80)</option>
        <option value="3" ${p.prorPeakHours==="3"?"selected":""}>3&ndash;&lt;4 h (9.40)</option>
        <option value="4to6" ${p.prorPeakHours==="4to6"?"selected":""}>4&ndash;6 h (10.55)</option>
      </select></div>
    <div class="radio-row"><label><input type="checkbox" id="in-blockOnly" ${p.prorBlockOnly?"checked":""}> Apply premium to peak block only (else: all dry energy)</label></div>
  </fieldset>
  <div class="rev-card"><h3>Peaking run-of-river</h3>
    <div class="out-line"><span class="k">Year-1 total</span><span class="v">NPR ${cr(prorRev1).toFixed(2)} cr</span></div>
    <div class="out-line"><span class="k">vs RoR</span><span class="v">${((prorRev1/rorRev1-1)*100).toFixed(1)}%</span></div>
    <div class="out-line"><span class="k">Simple payback on pond</span><span class="v">${(DEFAULTS.pror.incrementalPondCr/((prorRev1-rorRev1)/1e7)).toFixed(1)} yr</span></div>
  </div>
  <fieldset><legend>Reservoir (illustrative 100 MW scale)</legend>
    <div class="field wide"><label for="in-resRegime">Tariff regime</label>
      <select id="in-resRegime" data-k="reservoirRegime">
        <option value="erc2082" ${p.reservoirRegime==="erc2082"?"selected":""}>ERC 2082 ceiling (&le;100 MW)</option>
        <option value="legacy" ${p.reservoirRegime==="legacy"?"selected":""}>Legacy NEA uniform</option>
      </select></div>
    ${fieldNum("reservoirDryGwh","Dry energy (GWh)",1,p)}
    ${fieldNum("reservoirWetGwh","Wet energy (GWh)",1,p)}
  </fieldset>
  <div class="rev-card"><h3>Reservoir</h3>
    <div class="out-line"><span class="k">Revenue</span><span class="v">NPR ${cr(resRev).toFixed(2)} cr</span></div>
    <div class="out-line"><span class="k">Blended tariff</span><span class="v">NPR ${resBlend.toFixed(2)}/kWh</span></div>
    <div class="out-line"><span class="k">Dry share</span><span class="v">${(p.reservoirDryGwh/(p.reservoirDryGwh+p.reservoirWetGwh)*100).toFixed(0)}%</span></div>
  </div>
  <h3>Blended tariff comparison</h3>
  <svg id="cmp-chart" viewBox="0 0 260 130"><g>${barsSvg}
    <line x1="20" y1="122" x2="250" y2="122" stroke="var(--line)"/></g></svg>
  <p class="why">&sup1; A 10 MW reservoir is unrealistic in Nepal; the reservoir bar uses the 100 MW illustrative scale above so the per-kWh comparison stays meaningful.</p>
  <h3>Royalty (10 MW RoR example, year 1 revenue)</h3>
  <table class="mini"><caption>NPR per year, split capacity + energy</caption>
  <tr><th>Period</th><th>Capacity</th><th>Energy</th><th>Total</th></tr>
  <tr><td>Years 1&ndash;15</td><td>${cr(e.installedMw*1000*100).toFixed(2)} cr</td><td>${cr(0.0175*rorRev1).toFixed(2)} cr</td><td>${cr(royalty1).toFixed(2)} cr</td></tr>
  <tr><td>After year 15</td><td>${cr(e.installedMw*1000*1000).toFixed(2)} cr</td><td>${cr(0.10*rorRev1).toFixed(2)} cr</td><td>${cr(royalty16).toFixed(2)} cr</td></tr>
  </table>
  <button id="copy-btn">Copy assumptions</button>`;
}
function renderGlossary(){
  return `<h2>Glossary</h2>
  <input type="text" id="gloss-search" placeholder="Search terms&hellip;">
  <dl id="gloss-list">${GLOSSARY.map(([t,d,w])=>
    `<div class="gloss-item" data-t="${t.toLowerCase()}"><dt>${t}</dt><dd>${d}</dd><dd class="why">${w}</dd></div>`).join("")}</dl>`;
}
function wireDynamicInputs(){
  document.querySelectorAll('[id^="in-"][data-k]').forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const k=inp.dataset.k;
      if(k in APP.calc) APP.calc[k]=parseFloat(inp.value)||0;
      else if(k==="prorPeakHours") APP.ppa.prorPeakHours=inp.value;
      else if(k==="reservoirRegime") APP.ppa.reservoirRegime=inp.value;
      else if(k in APP.ppa) APP.ppa[k]=parseFloat(inp.value)||0;
      updateHeadLabel();
      renderPanel();
    });
  });
  document.querySelectorAll('input[name="seasonOpt"]').forEach(r=>
    r.addEventListener("change", ()=>{ APP.ppa.seasonOption=+r.value; renderPanel(); }));
  const blockOnly=document.getElementById("in-blockOnly");
  if(blockOnly) blockOnly.addEventListener("change", ()=>{ APP.ppa.prorBlockOnly=blockOnly.checked; renderPanel(); });
  const search=document.getElementById("gloss-search");
  if(search) search.addEventListener("input", ()=>{
    const q=search.value.toLowerCase();
    document.querySelectorAll(".gloss-item").forEach(it=>
      it.style.display = it.dataset.t.includes(q)?"":"none");
  });
  const copyBtn=document.getElementById("copy-btn");
  if(copyBtn) copyBtn.addEventListener("click", ()=>{
    const e=siteEnergy(APP.calc);
    const rows=[["Gross head (m)",APP.calc.grossHead],["Head loss",APP.calc.headLossFrac],
      ["Design Q (m3/s)",APP.calc.designQ],["Efficiency",APP.calc.eff],
      ["Availability",APP.calc.availability],["Dry avg Q (m3/s)",APP.calc.dryAvgQ],
      ["Wet output frac",APP.calc.wetOutFrac],["Net head (m)",e.netHead.toFixed(1)],
      ["Installed MW",e.installedMw],["Dry energy (GWh)",gwh(e.dryEnergyKwh).toFixed(2)],
      ["Wet energy (GWh)",gwh(e.wetEnergyKwh).toFixed(2)],["Annual energy (GWh)",gwh(e.annualEnergyKwh).toFixed(2)],
      ["PLF",(e.plf*100).toFixed(1)+"%"],["Dry share",(e.dryShare*100).toFixed(1)+"%"]];
    const text=rows.map(r=>r.join("\t")).join("\n");
    navigator.clipboard?.writeText(text).then(()=>{
      copyBtn.textContent="Copied"; copyBtn.dataset.done="1";
      setTimeout(()=>{copyBtn.textContent="Copy assumptions"; copyBtn.dataset.done="";},1600);
    }).catch(()=>{ copyBtn.textContent="Select panel text to copy"; });
  });
}
function renderFlags(){
  const flags=[
    "PRoR premium application (all dry energy vs peak block only) depends on the signed PPA.",
    "Escalation anchor (COD vs PPA date) depends on the signed PPA.",
    "Royalty tiers taken from the Hydropower Development Policy 2058; confirm against the licence.",
    "Tax-holiday COD cut-off is extended by Finance Acts; confirm the current date.",
    "Reservoir rates above 100 MW are cost-based and project-specific under the ERC 2082 directive.",
    "Capex-per-MW ranges are indicative; use the project DPR.",
    "Drawn as a longitudinal profile with the vertical exaggerated for readability. Schematic, not to scale and not engineering-grade."
  ];
  document.getElementById("flags-list").innerHTML="<ul>"+flags.map(f=>`<li>${f}</li>`).join("")+"</ul>";
}

/* ============================== init ============================== */
let FLEET = null;
try { FLEET = JSON.parse(document.getElementById("fleet").textContent); } catch(e) {}
// Absolute, so the link works from the deployed site, from a local file open and
// from an Artifact copy alike. Hidden inside the ledger's own iframe, where it
// would only be a link back to the page you are already on.
if(window.top === window.self) document.getElementById("back-link").hidden = false;
drawFdcMarker();
applyPlantType("RoR");
applySeason(5);
setActiveTab("look");
renderFlags();
VB.x=WHOLE_VIEW[0]; VB.y=WHOLE_VIEW[1]; VB.w=WHOLE_VIEW[2]; VB.h=WHOLE_VIEW[3];
applyVB();
setFocus(null);

function frame(now){ stepView(now); stepDay(now); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
